name: cipherbird
description: "CipherBird for Flutter: hashing, AEAD, asymmetric, vaults, post-quantum (ML-KEM/ML-DSA/SLH-DSA), hybrid KEM, BLS, Noise, sealed messaging and a keyring via dart:ffi, with easy-mode keys. The native library is bundled per platform."
version: 1.0.0
homepage: https://github.com/Crdzbird/CryptoLib
repository: https://github.com/Crdzbird/CryptoLib
issue_tracker: https://github.com/Crdzbird/CryptoLib/issues
documentation: https://github.com/Crdzbird/CryptoLib/blob/main/bridge/bindings/cipherbird/README.md
topics:
  - cryptography
  - encryption
  - post-quantum
  - ffi
  - security
# Platforms with a bundled native binary. Linux, Windows and web are not
# supported by this release (no prebuilt library is shipped for them).
platforms:
  android:
  ios:
  macos:

environment:
  sdk: ^3.12.0
  # Built-in Kotlin (Android) + Swift Package Manager (iOS/macOS) require 3.44+.
  flutter: '>=3.44.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  plugin:
    # ffiPlugin: native code is bundled and loaded via dart:ffi (no method
    # channel / plugin class). The prebuilt native engine is vendored per
    # platform — iOS/macOS via the podspec's vendored xcframework, Android via
    # jniLibs — so consuming apps need no manual setup or library path.
    platforms:
      android:
        # ffiPlugin bundles the .so; CipherbirdStartup (a manifest-registered
        # ContentProvider) warms the library off the main thread at launch.
        ffiPlugin: true
      ios:
        # FFI plugin. Distributed via Swift Package Manager (ios/cipherbird/
        # Package.swift), which links + embeds the CipherBird dynamic-framework
        # binary target; the CocoaPods podspec is kept as a fallback. Native
        # warm-up is driven from Dart (CipherBird.preload() on a background
        # isolate) — no native plugin class, so nothing link-references the
        # binary target (which Flutter's SPM integration does not propagate).
        ffiPlugin: true
      macos:
        ffiPlugin: true
