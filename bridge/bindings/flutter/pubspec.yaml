name: cryptolib_gui
description: CryptoLib GUI — Material 3 desktop app demonstrating all CryptoLib features via C FFI.
version: 3.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  file_picker: ^8.0.0+1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
