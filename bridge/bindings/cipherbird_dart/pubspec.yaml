name: cipherbird_dart
description: "CipherBird for Dart (servers, CLIs, desktop): the same native engine binding as the cipherbird Flutter plugin, with the native library bundled for the host platform. Hashing, AEAD, post-quantum, hybrid KEM, sealed messaging, Noise, recipes and easy-mode keys."
version: 1.0.0
homepage: https://github.com/Crdzbird/CryptoLib
repository: https://github.com/Crdzbird/CryptoLib
issue_tracker: https://github.com/Crdzbird/CryptoLib/issues
documentation: https://github.com/Crdzbird/CryptoLib/blob/main/bridge/bindings/cipherbird_dart/README.md
topics:
  - cryptography
  - encryption
  - post-quantum
  - ffi
  - security
platforms:
  macos:

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  test: ^1.25.0
  very_good_analysis: ^9.0.0
