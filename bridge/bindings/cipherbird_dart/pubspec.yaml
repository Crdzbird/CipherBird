name: cipherbird_dart
description: "Native cryptography for Dart over dart:ffi: hashing, AEAD, post-quantum, hybrid KEM, sealed messaging, Noise, recipes and easy-mode keys, engine bundled."
version: 1.1.0
homepage: https://github.com/Crdzbird/CipherBird
repository: https://github.com/Crdzbird/CipherBird
documentation: https://github.com/Crdzbird/CipherBird/blob/main/bridge/bindings/cipherbird_dart/README.md
topics:
  - cryptography
  - encryption
  - post-quantum
  - ffi
  - security
platforms:
  macos:
  web:

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.1.3
  meta: ^1.16.0

dev_dependencies:
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  test: ^1.25.0
  very_good_analysis: ^9.0.0
