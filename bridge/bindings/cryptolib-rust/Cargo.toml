[package]
name = "cryptolib"
version = "3.0.0"
edition = "2021"
description = "CryptoLib for Rust — hashing, AEAD, asymmetric, post-quantum (ML-KEM/ML-DSA/SLH-DSA), hybrid KEM, BLS and a keyring, via FFI. Native library bundled per platform."
license = "MIT"

[lib]
name = "cryptolib"
path = "src/lib.rs"

[[example]]
name = "smoke"
path = "examples/smoke.rs"
