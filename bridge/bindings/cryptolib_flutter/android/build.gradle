// CryptoLib Flutter plugin — Android module.
// Ships the prebuilt libcryptolib_c.so per ABI via jniLibs (no source build).
// The Android Gradle Plugin packages everything under jniLibs into the host
// app's APK; the Dart loader resolves it with DynamicLibrary.open('libcryptolib_c.so').

group = "com.cryptolib.cryptolib_flutter"
version = "3.0.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.0.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.cryptolib.cryptolib_flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }

    // Prebuilt .so files live in src/main/jniLibs/<abi>/.
    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}
