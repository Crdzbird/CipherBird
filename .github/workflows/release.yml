name: Release

# Tag-triggered supply-chain pipeline: build self-contained artifacts, generate
# an SBOM, checksum + keyless-sign them (cosign/OIDC), emit SLSA provenance, and
# attach everything to a GitHub Release. Requires the repo on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # keyless cosign + SLSA provenance (OIDC)

jobs:
  build:
    runs-on: macos-14
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Build self-contained desktop binary
        run: bash scripts/build_selfcontained.sh build/release-artifacts
      # SHA256SUMS lists each artifact by its bare file name, in sha256sum
      # format. The SLSA generator's base64-subjects input is that exact text,
      # base64-encoded, so every listed artifact becomes a provenance subject.
      - name: Checksums
        id: hash
        working-directory: build/release-artifacts
        run: |
          shasum -a 256 libcryptolib_c.dylib > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 < SHA256SUMS | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: build/release-artifacts/cryptolib.sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Keyless-sign the checksums
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature build/release-artifacts/SHA256SUMS.sig \
            --output-certificate build/release-artifacts/SHA256SUMS.pem \
            build/release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: build/release-artifacts/*

  # SLSA build provenance for the artifacts (verifiable with slsa-verifier).
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
