name: Release

# Tag-triggered release. Runs only for a commit whose CI run is green,
# verifies that every binary a consumer receives carries a build provenance
# attestation from the Engines workflow, then attaches those binaries, an
# SBOM, checksums and a keyless signature to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing v* tag to release again with the current workflow"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: read
  actions: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" \
            --json conclusion,status --jq 'map(select(.status=="completed")) | .[0].conclusion // "missing"')"
          echo "CI for $RELEASE_TAG ($sha): $conclusion"
          test "$conclusion" = "success"
      - name: Require an attestation for every shipped binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/verify_attestations.sh

  publish:
    needs: [gate]
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Stage the shipped binaries under release names
        run: |
          mkdir -p dist
          cp bridge/bindings/cipherbird/android/src/main/jniLibs/arm64-v8a/libcipherbird.so dist/libcipherbird-android-arm64-v8a.so
          cp bridge/bindings/cipherbird/android/src/main/jniLibs/x86_64/libcipherbird.so dist/libcipherbird-android-x86_64.so
          cp bridge/bindings/cipherbird/ios/cipherbird/CipherBird.xcframework/ios-arm64/CipherBird.framework/CipherBird dist/CipherBird-ios-arm64
          cp bridge/bindings/cipherbird/ios/cipherbird/CipherBird.xcframework/ios-arm64-simulator/CipherBird.framework/CipherBird dist/CipherBird-ios-arm64-simulator
          cp bridge/bindings/cipherbird/macos/cipherbird/CipherBird.xcframework/macos-arm64/CipherBird.framework/Versions/A/CipherBird dist/CipherBird-macos-arm64
          cp bridge/bindings/cipherbird/assets/cipherbird.wasm dist/cipherbird.wasm
          cp bridge/bindings/cipherbird/assets/cipherbird.js dist/cipherbird.js
          cp bridge/bindings/cipherbird_dart/native/darwin-arm64/libcipherbird.dylib dist/libcipherbird-darwin-arm64.dylib
      - name: Checksums
        id: hash
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: dist/cipherbird.sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Keyless-sign the checksums
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes "See the package changelogs." --verify-tag
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*

  # SLSA provenance for the release checksums. The reusable workflow has to be
  # referenced by tag: the generator verifies its own tag at run time.
  provenance:
    needs: [publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      upload-assets: true
