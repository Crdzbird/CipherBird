name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# macOS-arm64 mirrors the known-good local build. Deps: Homebrew formulae +
# blst built from a pinned tag (not a formula) by scripts/ci/install_blst.sh,
# which installs the headers under include/blst/ to match <blst/blst.h>. Linux coverage would need the deps
# built from source (see scripts/) — tracked separately.
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: |
          brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Configure + build tests
        run: |
          cmake -S . -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCRYPTOLIB_BUILD_TESTS=ON -DCRYPTOLIB_BUILD_EXAMPLE=ON -DCRYPTOLIB_BUILD_BRIDGE=ON
          cmake --build build/test
      - name: Run tests and the showcases
        run: |
          ./build/test/cryptolib_tests
          ./build/test/cryptolib_showcase "$RUNNER_TEMP/showcase" > "$RUNNER_TEMP/showcase.log"
          tail -3 "$RUNNER_TEMP/showcase.log"
          ./build/test/cryptolib_showcase_bank

  asan:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Build + run under ASan/UBSan
        run: |
          cmake -S . -B build/asan -G Ninja -DCRYPTOLIB_SANITIZE=ON \
            -DCRYPTOLIB_BUILD_BRIDGE=OFF -DCRYPTOLIB_BUILD_EXAMPLE=OFF
          cmake --build build/asan --target cryptolib_tests
          ASAN_OPTIONS=detect_leaks=0 ./build/asan/cryptolib_tests

  tsan:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Build + run under ThreadSanitizer
        run: |
          cmake -S . -B build/tsan -G Ninja -DCRYPTOLIB_TSAN=ON \
            -DCRYPTOLIB_BUILD_BRIDGE=OFF -DCRYPTOLIB_BUILD_EXAMPLE=OFF
          cmake --build build/tsan --target cryptolib_tests
          TSAN_OPTIONS=halt_on_error=1 ./build/tsan/cryptolib_tests

  # MSan is intentionally NOT a job here: it requires libsodium/liboqs/OpenSSL to
  # be rebuilt with MSan instrumentation (uninstrumented deps cause false
  # uninitialised-read reports). Scope it to the pure in-repo parsers (stego /
  # packet) on a Linux runner with instrumented deps when that lands.

  fuzz:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps (LLVM clang for libFuzzer)
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1 llvm lld
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Build + run fuzz targets (time-boxed)
        env:
          CC: /opt/homebrew/opt/llvm/bin/clang
          CXX: /opt/homebrew/opt/llvm/bin/clang++
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCRYPTOLIB_FUZZ=ON -DCRYPTOLIB_BUILD_BRIDGE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld
          cmake --build build/fuzz
          for fz in build/fuzz/fuzz_packet build/fuzz/fuzz_stego build/fuzz/fuzz_diff_aead; do
            test -x "$fz"
            "$fz" -max_total_time=60 -print_final_stats=1
          done

  # Constant-time probe: secrets are marked undefined under Valgrind and any
  # branch on them fails the job. Authentication verdicts are declassified in
  # the library (detail/ct.hpp); the one verdict branch inside libsodium is
  # listed in tests/ct/ct_probe.supp. The full log is uploaded as an artifact.
  ctgrind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool valgrind pkg-config
          python3 -m pip install --break-system-packages 'cmake>=4.1,<5'
          cmake --version
      - name: Build pinned dependencies for Linux
        run: bash scripts/linux/build_deps.sh
      - name: Build the probe
        run: |
          cmake -S . -B build/ct -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCRYPTOLIB_CT_VALGRIND=ON -DCRYPTOLIB_BUILD_BRIDGE=OFF -DCRYPTOLIB_BUILD_TESTS=OFF \
            -DCRYPTOLIB_BUILD_EXAMPLE=OFF -DCRYPTOLIB_DEPS_ROOT="$PWD/third_party/linux/x86_64"
          cmake --build build/ct --target ct_probe
      - name: Run under memcheck
        run: |
          valgrind --tool=memcheck --error-exitcode=1 --track-origins=yes \
            --suppressions=tests/ct/ct_probe.supp \
            --log-file=ct_probe.valgrind.log ./build/ct/ct_probe || status=$?
          grep 'ERROR SUMMARY' ct_probe.valgrind.log
          exit "${status:-0}"
      - name: Keep the Valgrind log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ct_probe-valgrind-log
          path: ct_probe.valgrind.log

  # The Dart packages and the Go binding against a freshly built C ABI.
  bank_profile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: |
          brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Configure + build the bank profile
        run: |
          cmake -S . -B build/bank -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRYPTOLIB_PROFILE=bank \
            -DCRYPTOLIB_BUILD_TESTS=ON -DCRYPTOLIB_BUILD_BRIDGE=ON
          cmake --build build/bank
      - name: Run tests and the bank showcase
        run: |
          ./build/bank/cryptolib_tests
          ./build/bank/cryptolib_showcase_bank
      - name: The bank library carries no steganography, media entropy or native combiner entry points
        run: |
          nm -gU build/bank/libcryptolib_c.dylib | grep ' _cryptolib_' | awk '{print $3}' | sort > build/bank/exports.txt
          if grep -E '_cryptolib_(stego|entropy_from|hpke_stego)' build/bank/exports.txt; then
            echo "bank profile exports an excluded family" >&2; exit 1
          fi
          for excluded in suite_seal_pq molecular_seal session_initiate; do
            grep -q "_cryptolib_$excluded" build/bank/exports.txt || { echo "stub $excluded missing" >&2; exit 1; }
          done
          grep -q '_cryptolib_xwing_keygen' build/bank/exports.txt
          grep -q '_cryptolib_suite2_seal' build/bank/exports.txt
          grep -q '_cryptolib_session2_accept' build/bank/exports.txt
          echo "bank exports: $(wc -l < build/bank/exports.txt)"

  fips_profile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: brew install cmake ninja libsodium
      - name: Build OpenSSL 3.1.2 with the FIPS provider (hash-pinned, CMVP #4985)
        run: bash scripts/ci/install_openssl_fips.sh "$HOME/openssl-fips"
      - name: Configure + build the fips profile
        run: |
          PKG_CONFIG_PATH="$HOME/openssl-fips/lib/pkgconfig" \
            cmake -S . -B build/fips -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRYPTOLIB_PROFILE=fips \
              -DCRYPTOLIB_BUILD_TESTS=ON -DCRYPTOLIB_BUILD_BRIDGE=ON
          cmake --build build/fips
      - name: Run tests against the validated module in approved mode
        run: |
          export CRYPTOLIB_FIPS_MODULE_DIR="$HOME/openssl-fips/lib/ossl-modules"
          export CRYPTOLIB_FIPS_CONFIG="$HOME/openssl-fips/ssl/openssl-fips.cnf"
          ./build/fips/cryptolib_tests
          ./build/fips/cryptolib_showcase_fips
      - name: The fips library references no libsodium primitive and links the 3.1.2 libcrypto
        run: |
          nm -u build/fips/libcryptolib_c.dylib | grep -E '_sodium_|_crypto_|_randombytes' | sort > build/fips/sodium_refs.txt
          cat build/fips/sodium_refs.txt
          if grep -vE '^_sodium_(init|memzero|mlock|munlock|memcmp)$' build/fips/sodium_refs.txt; then
            echo "fips profile references a libsodium primitive" >&2; exit 1
          fi
          otool -L build/fips/libcryptolib_c.dylib | grep -q "openssl-fips/lib/libcrypto.3.dylib"
          nm -gU build/fips/libcryptolib_c.dylib | grep ' _cryptolib_' | awk '{print $3}' | sort > build/fips/exports.txt
          if grep -E '_cryptolib_(vault_|box_|ed25519|x25519|argon2|xchacha|keyring_|stego|entropy_from)' build/fips/exports.txt; then
            echo "fips profile exports a libsodium-backed family" >&2; exit 1
          fi
          grep -q '_cryptolib_fips_init' build/fips/exports.txt
          echo "fips exports: $(wc -l < build/fips/exports.txt)"

  bindings:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1 go
      - name: Build blst from source (pinned)
        run: bash scripts/ci/install_blst.sh /opt/homebrew
      - name: Build the C ABI
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRYPTOLIB_BUILD_TESTS=OFF
          cmake --build build/release --target cryptolib_c
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: cipherbird (Flutter) native suite
        working-directory: bridge/bindings/cipherbird
        run: |
          flutter pub get
          CIPHERBIRD_LIBRARY="$GITHUB_WORKSPACE/build/release/libcryptolib_c.dylib" flutter test
      - name: cipherbird_dart native suite
        working-directory: bridge/bindings/cipherbird_dart
        run: |
          dart pub get
          CIPHERBIRD_LIBRARY="$GITHUB_WORKSPACE/build/release/libcryptolib_c.dylib" dart test
      - name: Go binding
        working-directory: bridge/bindings/go
        run: DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/release" go test ./cryptolib/
